name: data-integrity
on:
  push:
    paths: ['data/**', 'build_scripts/check_data_integrity.py']
  pull_request:
    paths: ['data/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 build_scripts/check_data_integrity.py
