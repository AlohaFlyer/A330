<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A330 Flows Trainer</title>
<style>
  :root{
    --midnight:#463C8F;
    --atlas:#CE0C88;
    --blue:#E26DB8;
    --breeze:#EAE5F4;
    --ice:#F4F1F9;
    --good:#8EC891;
    --red:#C8102E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:var(--ice);
    color:var(--midnight);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:20px;
  }
  h1{
    background:var(--midnight);color:#fff;padding:10px 24px;
    font-size:20px;letter-spacing:1px;margin-bottom:4px;
  }
  .src{font-size:11px;color:var(--atlas);margin-bottom:14px;text-align:center;}
  .topbar{display:flex;gap:14px;align-items:center;margin-bottom:14px;flex-wrap:wrap;justify-content:center;}
  .modes,.seat{display:flex;gap:0;}
  .modes button,.seat button{
    background:#fff;border:1.5px solid var(--blue);color:var(--blue);
    padding:6px 16px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .seat button{border-color:var(--midnight);color:var(--midnight);}
  .modes button.active{background:var(--blue);color:#fff;}
  .seat button.active{background:var(--midnight);color:#fff;}
  .controls{margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:760px;}
  .phasebar{display:flex;gap:4px;overflow-x:auto;max-width:96vw;width:auto;margin-bottom:8px;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  .phasebar button{flex:0 0 auto;background:#fff;border:1.5px solid var(--atlas);color:var(--atlas);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:5px 10px;cursor:pointer;border-radius:14px;white-space:nowrap;}
  .phasebar button.active{background:var(--atlas);color:#fff;}
  @media (max-width:480px){ .phasebar button{min-height:38px;} }
  .controls button{
    background:#fff;border:1.5px solid var(--midnight);color:var(--midnight);
    padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .controls button.active{background:var(--midnight);color:#fff;}
  .fl-item{color:var(--midnight);cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .fl-item b{color:var(--midnight);}
  .fl-item:hover{text-decoration:underline;}
  .fl-item.open b{text-decoration:underline;}
  .fl-detail{display:none;white-space:pre-line;color:var(--midnight);font-size:12.5px;line-height:1.45;
    background:#fff;border-left:3px solid var(--good);padding:7px 10px;margin:5px 0 7px;}
  .fl-detail.shown{display:block;}
  .clbadge{display:block;color:#2a7a2a;font-weight:700;font-size:12px;margin:3px 0 6px;}
  .trigbadge{color:#c8880a;font-weight:700;font-size:11.5px;margin-top:2px;}
  .brbadge{display:block;color:#831A57;font-weight:700;font-size:12px;margin:3px 0 6px;}
  .strgbadge{display:block;color:#d9534f;font-weight:700;font-size:12px;margin:3px 0 6px;}
  .grp{display:block;margin:10px 0 4px;padding:3px 10px;border-radius:12px;color:#fff;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;width:max-content;max-width:100%;box-sizing:border-box;}
  .grp small{font-weight:600;letter-spacing:0;text-transform:none;opacity:.9;margin-left:6px;}
  .grpq{display:block;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
  .done .step.gstep{border-left:4px solid var(--gc,#ccc);padding-left:8px;margin-left:0;}
  .fl-item.gitem{border-left:4px solid var(--gc,#ccc);padding-left:8px;}
  .grplegend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;} .grplegend span{font-size:10.5px;font-weight:700;color:#fff;padding:2px 9px;border-radius:10px;letter-spacing:.5px;}
  .phasehdr{width:100%;margin:18px 0 6px;padding:6px 12px;background:var(--midnight);color:#fff;font-weight:700;letter-spacing:1.5px;font-size:13px;text-transform:uppercase;box-sizing:border-box;}
  .phasesep{flex-basis:100%;width:100%;font-size:10px;font-weight:700;color:var(--atlas);text-transform:uppercase;letter-spacing:1px;margin:6px 0 0;text-align:left;}
  @media (max-width:480px){
    .modes button,.seat button{
      min-height:44px;padding:10px 16px;
      display:inline-flex;align-items:center;justify-content:center;
    }
    .controls button{
      min-height:44px;padding:10px 12px;
      display:inline-flex;align-items:center;justify-content:center;
    }
  }
  .layout{
    display:grid;
    grid-template-columns:minmax(280px,45%) 1fr;
    gap:14px;
    max-width:1024px;
    width:100%;
    align-items:start;
  }
  @media (max-width:740px){
    .layout{grid-template-columns:1fr;}
  }
  .layout.noflow{grid-template-columns:1fr;}
  .layout.noflow .mapbox{display:none;}
  .card{
    background:#fff;border:2px solid var(--midnight);
    flex:1;min-width:320px;max-width:560px;min-height:320px;
    padding:22px;display:flex;flex-direction:column;
  }
  .mapbox{background:#fff;border:2px solid var(--midnight);width:100%;box-sizing:border-box;padding:10px;position:relative;}
  #shapeBtn{position:absolute;top:8px;right:8px;z-index:5;background:#fff;border:1.5px solid var(--atlas);color:var(--atlas);font-size:11px;font-weight:700;padding:4px 10px;cursor:pointer;border-radius:3px;}
  #shapeBtn.active{background:var(--atlas);color:#fff;}
  #clOverlay{display:none;position:fixed;inset:0;background:rgba(1,33,55,0.55);z-index:50;align-items:center;justify-content:center;padding:16px;}
  .clbox{background:#fff;border:2px solid var(--midnight);max-width:480px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,0.35);}
  .clbox .clhead{display:flex;justify-content:space-between;align-items:center;background:var(--midnight);color:#fff;padding:8px 12px;font-weight:700;letter-spacing:0.5px;}
  .clbox .clhead button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1;}
  .clbox table{width:100%;border-collapse:collapse;padding:6px;}
  .clbox td{padding:7px 8px;font-size:13.5px;border-bottom:1px solid #EAE5F4;color:var(--midnight);}
  .clbox td.dots{border-bottom:1px dotted #A29DB0;width:20%;}
  .clbox td.resp{font-weight:700;text-align:right;white-space:nowrap;}
  .clbox td.who{color:var(--atlas);font-size:11px;white-space:nowrap;}
  .clbox .clsrc{font-size:10.5px;color:#888;padding:6px 12px 10px;text-align:right;}
  .clbadge{cursor:pointer;}
  .clbadge:hover{text-decoration:underline;}
  .mapbox .shapename{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:2px;}
  .mapbox .mnemonic{font-size:13px;color:var(--atlas);text-align:center;margin-bottom:6px;font-style:italic;}
  .mnemonic b{color:var(--midnight);font-style:normal;}
  .tag{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:1px;padding-right:150px;min-height:40px;}
  .who{font-size:11px;color:var(--atlas);margin-bottom:12px;}
  .done{font-size:13px;color:var(--atlas);line-height:1.55;margin-bottom:12px;}
  .done .step{display:block;}
  .done .step b{color:#6fae3d;} .done .step:hover b{text-decoration:underline;}
  .q{font-size:18px;font-weight:700;flex:1;}
  .a{
    font-size:16px;font-weight:600;margin-top:14px;padding:13px;
    background:var(--breeze);border-left:4px solid var(--blue);
    display:none;white-space:pre-line;
  }
  .a.shown{display:block;}
  .detail{
    font-size:13px;font-weight:400;color:#111;margin-top:10px;padding:12px 14px;
    background:#f4f0fa;border-left:4px solid #4B2D89;display:none;
    white-space:pre-line;line-height:1.65;border-radius:0 4px 4px 0;
  }
  .detail.shown{display:block;}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .actions button{
    flex:1;min-width:105px;padding:13px;font-size:15px;font-weight:700;
    border:none;cursor:pointer;color:#fff;background:var(--atlas);
    -webkit-tap-highlight-color:transparent;
  }
  #reveal{background:var(--blue);}
  
  #nextBtn{background:var(--midnight);}
  .count{margin-top:12px;font-size:12px;color:var(--atlas);}
  .fulllist{max-width:680px;width:100%;}
  .flowblock{background:#fff;border:2px solid var(--midnight);margin-bottom:14px;}
  .flowblock header{background:var(--midnight);color:#fff;padding:6px 10px;font-weight:700;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;}
  .flowblock header span:last-child{color:var(--breeze);font-size:12px;font-weight:600;}
  .flowblock .mn{padding:5px 10px;font-size:13px;font-style:italic;color:var(--atlas);border-bottom:1px dashed var(--blue);}
  .flowblock .mn b{color:var(--midnight);font-style:normal;}
  .flowblock .body{display:flex;gap:8px;align-items:flex-start;padding:8px;}
  .flowblock ol{padding:0 6px 4px 30px;font-size:13px;line-height:1.65;flex:1;}
  .flowblock svg{flex-shrink:0;}
  .hidden{display:none !important;}
  svg .zone{fill:var(--ice);stroke:var(--atlas);stroke-width:1;}
  svg .zonelabel{font-size:9px;fill:var(--atlas);font-weight:700;letter-spacing:1px;}
  svg .trace{fill:none;stroke:#F9423A;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;}
  svg .ghost{fill:none;stroke:#8d8d8d;stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:4 4;opacity:0.95;}
  svg .dot{fill:#fff;stroke:var(--midnight);stroke-width:1.5;}
  svg .dot.donept{fill:var(--breeze);}
  svg .dot.startpt{fill:#FFC9BF;stroke:#6fae3d;}
  svg .dot.endpt{fill:#d9534f;stroke:#b52b27;}
  svg .num{font-size:9px;fill:var(--midnight);font-weight:700;}
  svg .dot.roleCA{fill:#4B2D89;stroke:#3a2169;}
  svg .dot.roleFO{fill:#CE0C88;stroke:#9D178D;}
  svg .dot.rolePF{fill:#00805E;stroke:#1C4A0C;}
  svg .dot.rolePM{fill:#E26DB8;stroke:#831A57;}
  svg .dot.roleIRO{fill:#aaaaaa;stroke:#888;}
  svg .dot.roleBOTH{fill:#fff;stroke:#463C8F;}
  svg .dot.inactive{fill:#dcdcdc;stroke:#bdbdbd;opacity:.55;}
  svg .dot.current{fill:#E26DB8;stroke:var(--midnight);stroke-width:2;}
  svg .dot.trigpt{ fill:#d9534f; stroke:#8f2b27; stroke-width:2.5; }
  .legend{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:10px;color:#333;margin-top:6px;}
  .legend span{display:flex;align-items:center;gap:4px;}
  .xref{color:#CE0C88;text-decoration:underline;cursor:pointer;font-weight:600;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid #463C8F;flex-shrink:0;}
  .miniBtns{position:absolute;top:10px;right:12px;display:flex;gap:6px;}
  .miniBtns button{font-size:14px;padding:6px 12px;background:#fff;color:var(--midnight);border:1.5px solid var(--midnight);border-radius:4px;cursor:pointer;}
  .miniBtns button:hover{background:var(--midnight);color:#fff;}
  svg .numlight{font-size:9px;fill:#fff;font-weight:700;}
  svg .dot, svg .num, svg .numlight{cursor:pointer;}
</style>
<style>
.ps-homebar{align-self:stretch;width:100%;box-sizing:border-box;padding:8px 0 0 10px;flex:0 0 auto;text-align:left;}
.ps-home{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:#fff;border:2px solid #463C8F;color:#463C8F;text-decoration:none;box-shadow:0 1px 4px rgba(1,23,43,.2);transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent;}
.ps-home:hover,.ps-home:focus-visible{background:#463C8F;color:#fff;}
.ps-home:focus{outline:none;}
.ps-home svg{display:block;}
@media (max-width:480px){.ps-homebar{padding:6px 0 0 8px;}.ps-home{width:40px;height:40px;}}
</style>

}
</style>

<script>
/* FLOWS, XREFS and NORMAL_CHECKLISTS live in data/flows_trainer.json, loaded here; engine below is unchanged */
fetch('data/flows_trainer.json',{cache:'no-store'}).then(r=>r.json()).then(function(__d){
const FLOWS=__d.FLOWS, XREFS=__d.XREFS, NORMAL_CHECKLISTS=__d.NORMAL_CHECKLISTS;
if(!FLOWS.length){document.getElementById('drillLayout').innerHTML='<div class="card"><div class="tag">Bank not loaded yet</div><div class="who">This bank is built in a later step. The engine is live.</div></div>';return;}
// role: CA | FO | BOTH | PF | PM. Seat filter CA hides pure-FO items; FO hides pure-CA. PF/PM shown to both seats.
// Mnemonics: first letters bold-capped via <b> markup, matching the items in order (for the seat=Both view).



function showXref(key){
  const x = XREFS[key]; if(!x) return;
  const existing = document.getElementById("xrefBox");
  if(existing){ existing.remove(); return; }
  const box = document.createElement("div");
  box.id = "xrefBox";
  box.style.cssText = "margin-top:8px;padding:10px 12px;background:#fff8e7;border-left:4px solid #e6a817;border-radius:0 4px 4px 0;font-size:13px;white-space:pre-line;line-height:1.6;";
  box.innerHTML = "<b style='font-size:11px;color:#888;'>" + x.title + "</b>\n" + x.body + (x.ref ? "\n<b style='font-size:11px;color:#888;'>" + x.ref + (x.page ? " &middot; PDF p. " + x.page : "") + "</b> <a class=\"xref\" href=\"/manuals/?s=" + encodeURIComponent(x.ref) + "\" target=\"_blank\" rel=\"noopener\">Open in Manuals</a>" : "");
  document.getElementById("detail").after(box);
}

function fmtLine(l){
  if(l.startsWith("[LINK:")){ var inr=l.slice(6, l.lastIndexOf("]")); var bp=inr.indexOf("|"); var url=inr.slice(0,bp); var txt=inr.slice(bp+1); return "<a href='"+url+"' style='display:inline-block;margin-top:8px;color:#CE0C88;font-weight:700;text-decoration:underline;'>"+txt+"</a>"; }
  if(l.startsWith("[IMG:")) { var p = l.slice(5, l.indexOf("]")); return "<img src='assets/" + p + "' alt='light switch positions' style='width:100%;max-width:520px;display:block;margin:6px 0;border:1px solid #ccc;border-radius:4px;cursor:zoom-in;' onclick='window.open(this.src,\"_blank\")'>"; }
  if(l.startsWith("#")) return "<span style='color:#4B2D89;font-weight:600;'>" + linkRefs(l) + "</span>";
  if(l.startsWith("[")) return "<span style='color:#888;font-size:11px;font-weight:600;'>" + l + "</span>";
  if(l.startsWith("✅")) return "<span style='color:#2a7a2a;font-weight:700;'>" + l + "</span>";
  if(l.startsWith("•")){
    return l.replace(/^(• )([^:]+)(:.*)$/, function(m,p,label,rest){
      return p + "<b>" + label + "</b>" + rest;
    });
  }
  return linkRefs(l);
}
function linkRefs(t){
  t = t.replace(/\b(WARNING)\b/g, '<b style="color:#d9534f;">$1</b>');
  t = t.replace(/\b(CAUTION)\b/g, '<b style="color:#e6a817;">$1</b>');
  t = t.replace(/\b(ADVISORY)\b/g, '&#8594; <b style="color:#c8880a;">$1</b>');
  t = t.replace(/\b(MEMO)\b/g, '<b style="color:#E26DB8;">$1</b>');
  t = t.replace(/\b(FCTM PR-[A-Z0-9-]+|QRH [A-Z0-9.-]+|PRO-(?:NOR|ABN|SPO|SUP)-[A-Z0-9-]+|DSC-\d\d-\d\d(?:-\d\d)?|LIM-[A-Z0-9-]+|PER-[A-Z0-9-]+)\b/g, function(m){
    if(XREFS[m]) return '<span class="xref" onclick="showXref(\''+m.replace(/ /g,'\\x20')+'\');">'+m+'</span>';
    return m;
  });

const BG = "assets/a330_cockpit.jpg";
function zoneSvg(){
  return `<image href="${BG}" x="0" y="0" width="300" height="437" opacity="1"/>`;
}
// Path builder: straight runs stay direct, but any segment that reverses
// course (>~100 degree turn) bows out to the side so it never overdraws
// the lines already on the map.
function flowPath(P){
  if(P.length<2) return "";
  let d = `M${P[0][0]},${P[0][1]}`;
  for(let i=1;i<P.length;i++){
    const a=P[i-1], b=P[i];
    const vx=b[0]-a[0], vy=b[1]-a[1];
    const segLen=Math.hypot(vx,vy);
    let reverse=false;
    if(i>1 && segLen>0){
      const ux=a[0]-P[i-2][0], uy=a[1]-P[i-2][1];
      const ulen=Math.hypot(ux,uy);
      if(ulen>0 && (ux*vx+uy*vy)/(ulen*segLen) < -0.3) reverse=true;
    }
    if(reverse){
      const nx=-vy/segLen, ny=vx/segLen;
      const off=Math.min(42, 16+segLen*0.22);
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      let cx=mx+nx*off, cy=my+ny*off;
      const cx2=mx-nx*off, cy2=my-ny*off;
      if(Math.abs(cx2-150)>Math.abs(cx-150)){cx=cx2; cy=cy2;}
      cx=Math.max(8,Math.min(292,cx)); cy=Math.max(8,Math.min(429,cy));
      d += ` Q${cx.toFixed(1)},${cy.toFixed(1)} ${b[0]},${b[1]}`;
    } else {
      d += ` L${b[0]},${b[1]}`;
    }
  }
  return d;
}
function mapPt(x,y){ return [x,y]; }
function seatPt(it){ const p = it.pos && (it.pos[seat] || (seat==="BOTH" && it.pos.FO)); if(p) return [p[0],p[1]]; if(it.mir && seat==="FO") return [Math.round((300-it.x)*10)/10, it.y]; return [it.x,it.y]; }

// smooth hand-motion curve through points (Catmull-Rom -> cubic Bezier)
function smoothPath(P){
  if(P.length<2) return "";
  if(P.length===2) return `M${P[0][0]},${P[0][1]} L${P[1][0]},${P[1][1]}`;
  let d = `M${P[0][0]},${P[0][1]}`;
  for(let i=0;i<P.length-1;i++){
    const p0 = P[Math.max(i-1,0)], p1 = P[i], p2 = P[i+1], p3 = P[Math.min(i+2,P.length-1)];
    const c1 = [p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2 = [p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function getViewBox(flow){
  if(flow.vb) return flow.vb;
  const all = flow.items;
  if(!all.length) return "0 0 300 437";
  const xs = all.map(i=>seatPt(i)[0]), ys = all.map(i=>seatPt(i)[1]);
  const pad = 30;
  let x0=Math.max(0,Math.min(...xs)-pad), y0=Math.max(0,Math.min(...ys)-pad);
  let x1=Math.min(300,Math.max(...xs)+pad), y1=Math.min(437,Math.max(...ys)+pad);
  // minimum size 90x90 so small flows aren't absurdly zoomed
  const minW=90, minH=90;
  if(x1-x0<minW){const cx=(x0+x1)/2; x0=Math.max(0,cx-minW/2); x1=Math.min(300,cx+minW/2);}
  if(y1-y0<minH){const cy=(y0+y1)/2; y0=Math.max(0,cy-minH/2); y1=Math.min(437,cy+minH/2);}
  return `${x0} ${y0} ${x1-x0} ${y1-y0}`;
}

function drawMap(svgEl, flow, upto, showAll){
  const vb = getViewBox(flow);
  svgEl.setAttribute("viewBox", vb);
  if(flow.noflow){ svgEl.innerHTML = zoneSvg(); return; }
  const seq = flow.items.filter(it=>!isOff(it));
  const off = flow.items.filter(it=>isOff(it));
  const P = seq.map(it=>seatPt(it));
  let s = zoneSvg();
  s += `<path class="ghost" d="${flowPath(P)}"/>`;
  if(upto>1 || showAll){
    const PD = showAll ? P : P.slice(0, Math.max(upto,1));
    s += `<path class="trace" d="${flowPath(PD)}"/>`;
  }
  off.forEach(it=>{ const q=seatPt(it); s += `<circle class="dot inactive" cx="${q[0]}" cy="${q[1]}" r="6"/>`; });
  const last = seq.length-1;
  seq.forEach((it,i)=>{
    let cls = "dot role"+it.role;
    let lightNum = ["CA","FO","PF","PM"].includes(it.role);
    if(i===0){cls="dot startpt"; lightNum=false;}
    else if(i===last){cls="dot endpt"; lightNum=true;}
    if(!showAll && i===upto && i!==0 && i!==last){cls+=" current"; lightNum=false;}
    if(it.trg){ cls += " trigpt"; }
    const q=seatPt(it);
    s += `<circle class="${cls}" data-i="${i}" cx="${q[0]}" cy="${q[1]}" r="8"/>`;
    s += `<text class="${lightNum?'numlight':'num'}" data-i="${i}" x="${q[0]-3}" y="${q[1]+3.5}">${i+1}</text>`;
  });
  svgEl.innerHTML = s;
}

function grpInfo(items, i){
  // position of item i inside its group, counting only the items active for this seat/duty
  const g = items[i].g; if(!g) return null;
  let n=0, k=0;
  for(let j=0;j<items.length;j++){ if(items[j].g===g){ n++; if(j===i) k=n; } }
  return {g:g, gc:items[i].gc||"#463C8F", gb:items[i].gb||"", k:k, n:n};
}
function grpHeader(items, i, cls){
  const gi = grpInfo(items, i); if(!gi) return "";
  if(i>0 && items[i-1].g===gi.g) return "";
  return "<span class=\"" + (cls||"grp") + "\" style=\"background:" + gi.gc + "\">" + (gi.gb ? gi.gb + " · " : "") + gi.g + " <small>" + gi.n + "</small></span>";
}
function grpLegend(f){
  if(!f.groups) return "";
  const items = activeItems(f);
  return "<div class=\"grplegend\">" + f.groups.map(g=>{ const n = items.filter(it=>it.g===g.g).length; return n ? "<span style=\"background:"+g.gc+"\">"+(g.gb?g.gb+" · ":"")+g.g+" "+n+"</span>" : ""; }).join("") + "</div>";
}

    document.getElementById("a").innerHTML = (items[stepIdx].lt ? "\ud83d\udca1 " : "") + (items[stepIdx].item + " - " + items[stepIdx].act + "  (" + items[stepIdx].role + ")").replace(/</g,"&lt;") + (items[stepIdx].cl ? "<span class=\"clbadge\" onclick=\"event.stopPropagation();showChecklist('" + items[stepIdx].cl + "')\">✅ Call: " + items[stepIdx].cl + " <small style='color:#5a8a5a;font-weight:600;'>(" + (items[stepIdx].clWho||"") + ")</small></span>" : "") + (items[stepIdx].brief ? "<span class=\"brbadge\">\ud83d\udde3\ufe0f " + items[stepIdx].brief + " <small style='color:#8C7EB8;font-weight:600;'>(" + (items[stepIdx].briefWho||"") + ")</small></span>" : "") + (items[stepIdx].trg ? "<span class=\"strgbadge\">\ud83d\udd3b TRIGGER → " + items[stepIdx].trg + "</span>" : "");

  if(f.single){ document.getElementById("q").textContent=""; document.getElementById("a").classList.add("shown"); document.getElementById("detail").classList.add("shown"); document.getElementById("reveal").style.display="none"; revealed=true; } else { document.getElementById("reveal").style.display=""; }
}

        cb.title = "Tap to view the checklist";
        cb.onclick = (e)=>{ e.stopPropagation(); showChecklist(it.cl); };
        li.appendChild(cb);
      }
      if(it.brief){
        const bb = document.createElement("span");
        bb.className = "brbadge";
        bb.innerHTML = "\ud83d\udde3\ufe0f " + it.brief + " <small style='color:#8C7EB8;font-weight:600;'>(" + (it.briefWho||"") + ")</small>";
        li.appendChild(bb);
      }
      if(it.trg){
        const tg = document.createElement("span");
        tg.className = "strgbadge";
        tg.innerHTML = "\ud83d\udd3b TRIGGER → " + it.trg;
        li.appendChild(tg);
      }
      ol.appendChild(li);
    });
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox", getViewBox(f));
    svg.setAttribute("width","170");
    svg.setAttribute("height","170");
    drawMap(svg, f, items.length, true);
    const dets = Array.from(ol.querySelectorAll(".fl-detail"));
    const heads = Array.from(ol.querySelectorAll(".fl-item"));
    svg.addEventListener("click", e=>{
      const t = e.target.closest("[data-i]");
      if(!t) return;
      const i = +t.getAttribute("data-i");
      if(dets[i]){ dets[i].classList.add("shown"); heads[i].classList.add("open");
        heads[i].scrollIntoView({behavior:"smooth", block:"center"}); }
    });
    body.appendChild(ol);
    body.appendChild(svg);
    block.appendChild(body);
    listDiv.appendChild(block);
  });
}
buildFullList();
buildPhaseBar();
buildFlowBtns();

document.getElementById("modeDrill").onclick = ()=>{
  hidePoster();
  document.getElementById("modeDrill").classList.add("active");
  document.getElementById("modeList").classList.remove("active");
  document.getElementById("drillLayout").classList.remove("hidden");
  document.getElementById("count").classList.remove("hidden");
  listDiv.classList.add("hidden");
};
document.getElementById("modeList").onclick = ()=>{
  hidePoster();
  document.getElementById("modeList").classList.add("active");
  document.getElementById("modeDrill").classList.remove("active");
  document.getElementById("drillLayout").classList.add("hidden");
  document.getElementById("count").classList.add("hidden");
  listDiv.classList.remove("hidden");
};

render();
Object.assign(window,{activeItems, grpInfo, grpHeader, grpLegend, buildFlowBtns, buildFullList, buildPhaseBar, drawMap, flowHidden, flowPath, fmtLine, getViewBox, hidePoster, isOff, linkRefs, mapPt, nextStep, phaseColor, render, setDuty, setSeat, showChecklist, showXref, smoothPath, syncPhaseUI, tintColor, zoneSvg});
}).catch(function(e){document.getElementById('drillLayout').innerHTML='<div class="card"><div class="tag">Bank failed to load</div><div class="who">'+e.message+'</div></div>';});
</script>
