<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>A330 Hot Seat</title>
<style>
:root{--bg:#1A1630;--panel:#2A2440;--panel2:#332E44;--line:#453F58;--ink:#F1EEF6;--muted:#C3BED0;
 --mid:#463C8F;--atlas:#CE0C88;--breeze:#E26DB8;--green:#8EC891;--amber:#f2a65a;--red:#ff6b6b;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px}
.wrap{width:100%;max-width:680px}
header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;gap:12px}
h1{font-size:15px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:0}
h1 .sub{color:var(--breeze);font-weight:600}
.src{font-family:var(--mono);font-size:11px;color:var(--muted)}
.hud{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:12px;gap:10px;flex-wrap:wrap}
.hud b{color:var(--ink)}
.clock{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--green)}
.clock.warn{color:var(--amber)} .clock.crit{color:var(--red)}
.tbar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.tfill{height:100%;width:100%;background:var(--green);transition:width .1s linear}
.tfill.warn{background:var(--amber)} .tfill.crit{background:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 22px;min-height:230px;display:flex;flex-direction:column;gap:12px}
.inject{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.scn{font-size:18px;line-height:1.4;color:var(--muted)}
.warnbox{background:#2a0f12;border:1px solid #7a2730;border-left:4px solid var(--red);border-radius:6px;padding:10px 14px}
.warnbox .ttl{font-size:22px;font-weight:800;letter-spacing:.04em;color:#ffd0d0}
.warnbox .ref{font-family:var(--mono);font-size:11px;color:#d99}
.cue{text-align:center;color:var(--muted);font-size:14px;margin-top:4px}
.readout{background:#120F1F;border:1px solid #4A4460;border-left:3px solid var(--green);border-radius:6px;padding:14px 16px;font-size:14.5px;line-height:1.5}
.readout .ln{margin:3px 0}.readout .num{display:inline-block;min-width:18px;color:var(--breeze);font-weight:700;font-family:var(--mono)}
.readout .sub{margin-left:22px;color:#DCD8E6}.readout .bul{margin-left:34px;color:#DCD8E6}
.readout b{color:var(--green)} .readout i{color:var(--muted)}
.spacer{flex:1}
.controls{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;border-radius:8px;padding:13px 18px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);transition:.1s}
button:hover{border-color:var(--breeze)}
.primary{background:var(--atlas);color:#fff;border-color:var(--atlas);flex:1}
.knew{border-color:var(--green);color:var(--green);flex:1}.knew:hover{background:rgba(192,229,133,.14)}
.rev{border-color:var(--amber);color:var(--amber);flex:1}.rev:hover{background:rgba(242,166,90,.14)}
.start{background:var(--atlas);color:#fff;border-color:var(--atlas);font-size:16px;padding:14px 26px}
.over{text-align:center;padding:28px 14px}
.over .big{font-family:var(--mono);font-size:50px;color:var(--green);font-weight:700}
.over .lbl{color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.over .best{color:var(--amber);font-family:var(--mono);font-size:13px;margin:10px 0 22px}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
@media(max-width:480px){.warnbox .ttl{font-size:18px}}
</style><style>
.ps-homebar{align-self:stretch;width:100%;box-sizing:border-box;padding:8px 0 0 10px;flex:0 0 auto;text-align:left;}
.ps-home{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:#fff;border:2px solid #463C8F;color:#463C8F;text-decoration:none;box-shadow:0 1px 4px rgba(1,23,43,.2);transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent;}
.ps-home:hover,.ps-home:focus-visible{background:#463C8F;color:#fff;}
.ps-home:focus{outline:none;}
.ps-home svg{display:block;}
@media (max-width:480px){.ps-homebar{padding:6px 0 0 8px;}.ps-home{width:40px;height:40px;}}
</style>
<script>
/* Storage access throws outright in some private-browsing and embedded-webview
   contexts. These pages read localStorage at the top level of their inline
   script, so an exception there aborted the whole script and the page rendered
   inert. This shim keeps the API shape and degrades to in-memory. */
(function () {
  try { var t = '__t'; window.localStorage.setItem(t, t); window.localStorage.removeItem(t); return; }
  catch (e) {}
  var mem = {};
  try {
    Object.defineProperty(window, 'localStorage', {
      configurable: true,
      value: {
        getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
        setItem: function (k, v) { mem[k] = String(v); },
        removeItem: function (k) { delete mem[k]; },
        clear: function () { mem = {}; },
        key: function (i) { return Object.keys(mem)[i] || null; },
        get length() { return Object.keys(mem).length; }
      }
    });
  } catch (e) {}
})();
</script>
<link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#463C8F">
</head>
<body>
<div class="ps-homebar"><a class="ps-home" href="/index.html" title="A330 Study Portal" aria-label="A330 Study Portal"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" focusable="false"><path d="M3 11.3 12 4l9 7.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.7 10.1v9.4h12.6v-9.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19.5v-5.1h4v5.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>

<div class="wrap">
 <header><h1>Hot Seat <span class="sub">// Recite Under Pressure</span></h1><span class="src">FCOM R17 [MEM]</span></header>
 <div id="app"></div>
 <div class="hint">Read the inject, recite the memory items ALOUD, then Reveal to check &nbsp;&middot;&nbsp; Space = reveal &nbsp;&middot;&nbsp; beat the clock</div>
</div>
<script>
/* bank(s) DATA, SCN live in data/, loaded here; engine below is unchanged */
Promise.all([fetch('data/memory_items_drill.json',{cache:'no-store'}).then(r=>r.json()), fetch('data/hot_seat_scenarios.json',{cache:'no-store'}).then(r=>r.json())]).then(function(__b){
const [DATA, SCN]=__b;
if(!(Array.isArray(DATA)?DATA.length:Object.keys(DATA).length)){(document.getElementById('main')||document.getElementById('app')||document.getElementById('list')||document.getElementById('board')||document.body).innerHTML='<div class="card"><div class="summary"><div class="lbl">Bank not loaded yet</div><div class="srcsub">This bank is built in a later step. The engine is live.</div></div></div>';return;}
const TMAX=20000;
let queue,idx,passes,timeBonus,revealed,timer,t0,locked;
let best=+(localStorage.getItem('hs_best')||0);
const app=document.getElementById('app');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stepsHTML(steps){return steps.map(s=>{if(s.t==='n')return `<div class="ln"><span class="num">${s.n}</span>${s.h}</div>`;if(s.t==='s')return `<div class="ln sub">${s.h}</div>`;return `<div class="ln bul">&bull; ${s.h}</div>`;}).join('')}
function startGame(){queue=shuffle([...Array(DATA.length).keys()]);idx=0;passes=0;timeBonus=0;round();}
function round(){
 if(idx>=queue.length)return over();
 const d=DATA[queue[idx]];revealed=false;locked=false;
 app.innerHTML=`<div class="hud"><span>inject <b>${idx+1}</b> / ${queue.length}</span><span>nailed <b>${passes}</b></span><span class="clock" id="clk">${(TMAX/1000).toFixed(0)}s</span></div>
  <div class="tbar"><div class="tfill" id="tf"></div></div>
  <div class="card">
   <div class="inject">PIC &mdash; memory items</div>
   <div class="scn">${SCN[d.name]||d.cond}</div>
   <div class="warnbox"><div class="ttl">${d.name}</div><div class="ref">${d.ref} &middot; ${d.cond}</div></div>
   <div id="body"></div>
   <div class="spacer"></div>
   <div class="controls" id="ctrl"><button class="primary" onclick="reveal()">Reveal steps &nbsp;(Space)</button></div>
  </div>`;
 const tf=document.getElementById('tf'),clk=document.getElementById('clk');
 clearInterval(timer);t0=Date.now();
 timer=setInterval(()=>{const left=TMAX-(Date.now()-t0);const pct=Math.max(0,left/TMAX*100);
  tf.style.width=pct+'%';tf.className='tfill'+(pct<50?' warn':'')+(pct<22?' crit':'');
  clk.textContent=Math.max(0,left/1000).toFixed(0)+'s';clk.className='clock'+(pct<50?' warn':'')+(pct<22?' crit':'');
  if(left<=0){clearInterval(timer);if(!revealed)reveal(true);}},80);
}
function reveal(timeout){
 if(revealed)return;revealed=true;clearInterval(timer);
 const left=Math.max(0,TMAX-(Date.now()-t0));const d=DATA[queue[idx]];
 document.getElementById('body').innerHTML=`<div class="readout">${stepsHTML(d.steps)}</div>`;
 document.getElementById('ctrl').innerHTML=`<button class="knew" onclick="grade(true,${left})">Nailed it &nbsp;K</button><button class="rev" onclick="grade(false,0)">Missed &nbsp;R</button>`;
 if(timeout){document.querySelector('.clock').textContent='0s';}
}
function grade(ok,left){
 if(locked)return;locked=true;
 if(ok){passes++;timeBonus+=Math.round(left/1000);}
 idx++;round();
}
function over(){
 const pct=Math.round(passes/queue.length*100);const sc=passes*10+timeBonus;
 if(sc>best){best=sc;localStorage.setItem('hs_best',best);}
 app.innerHTML=`<div class="card"><div class="over"><div class="big">${pct}%</div><div class="lbl">nailed cold (${passes}/${queue.length})</div>
  <div class="best">score ${sc} &nbsp;(+${timeBonus} time bonus) &middot; best ${best}</div>
  <button class="start" onclick="startGame()">New scramble</button></div></div>`;
}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!revealed)reveal();}else if((e.key==='k'||e.key==='K')&&revealed){grade(true,Math.max(0,TMAX-(Date.now()-t0)));}else if((e.key==='r'||e.key==='R')&&revealed){grade(false,0);}});
function intro(){app.innerHTML=`<div class="card"><div class="over"><div class="lbl" style="margin-bottom:8px">10 emergency injects, FCOM R17 verbatim</div>
 <div class="scn" style="font-size:19px;text-align:center;color:#F1EEF6;margin:4px 0 6px">You're in the hot seat.</div>
 <div class="src" style="margin:6px 0 20px;color:#C3BED0">An emergency drops in &middot; recite aloud &middot; ${TMAX/1000}s to reveal</div>
 <button class="start" onclick="startGame()">Start</button>${best?`<div class="best">best ${best}</div>`:''}</div></div>`;}
intro();
Object.assign(window,{grade, intro, over, reveal, round, shuffle, startGame, stepsHTML});
}).catch(function(e){(document.getElementById('main')||document.getElementById('app')||document.getElementById('list')||document.getElementById('board')||document.body).innerHTML='<div class="card"><div class="summary"><div class="lbl">Bank failed to load</div><div class="srcsub">'+e.message+'</div></div></div>';});
</script>
<footer style="width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:28px auto 0;">
<img src="assets/A330_hero.jpg" alt="Airbus A330" style="width:380px;max-width:60%;height:auto;border-radius:6px;">
<div style="width:100%;text-align:right;font-size:11px;color:#FF9080;font-family:inherit;">Ver 1.6</div>
</footer>
<script src="/portal-settings.js" defer></script>
<script src="/assist.js" defer></script>
</body></html>
