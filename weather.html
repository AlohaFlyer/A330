<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A330 Weather Requirements Quiz</title>
<style>
  :root{
    --bg:#1A1630; --panel:#2A2440; --panel2:#332E44; --line:#453F58;
    --ink:#F1EEF6; --muted:#C3BED0;
    --mid:#463C8F; --atlas:#CE0C88; --breeze:#E26DB8; --green:#8EC891;
    --amber:#f2a65a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;}
  .wrap{width:100%;max-width:700px}
  header{display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px;gap:12px}
  h1{font-size:15px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:0}
  h1 .sub{color:var(--breeze);font-weight:600}
  .src{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
  .bar{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
  .bar .count{color:var(--ink)}
  .track{flex:1;height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;min-width:120px}
  .fill{height:100%;width:0;background:var(--atlas);transition:width .25s}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--breeze);border:1px solid var(--line);border-radius:3px;padding:3px 8px;align-self:flex-start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:24px 22px;min-height:240px;display:flex;flex-direction:column;gap:14px}
  .prompt .lead{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .q{font-size:23px;line-height:1.25;font-weight:700;letter-spacing:.01em}
  .cond{font-size:13px;color:var(--muted);font-style:italic;margin-top:6px;line-height:1.4}
  .readout{background:#120F1F;border:1px solid #4A4460;border-left:3px solid var(--green);
    border-radius:5px;padding:0 16px;font-size:14.5px;line-height:1.5;
    opacity:0;max-height:0;overflow:hidden;transition:opacity .2s}
  .readout.show{opacity:1;max-height:1200px;padding:14px 16px}
  .readout .ln{margin:3px 0;color:var(--ink)}
  .readout .num{display:inline-block;min-width:18px;color:var(--breeze);font-weight:700;font-family:var(--mono)}
  .readout .sub{margin-left:22px;color:#DCD8E6}
  .readout .bul{margin-left:34px;color:#DCD8E6}
  .readout b{color:var(--green);font-weight:700}
  .readout i{color:var(--muted);font-style:italic}
  .spacer{flex:1}
  .controls{display:flex;gap:10px;flex-wrap:wrap}
  button{font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;border-radius:6px;
    padding:11px 18px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);transition:.12s}
  button:hover{border-color:var(--breeze)}
  button:focus-visible{outline:2px solid var(--breeze);outline-offset:2px}
  .primary{background:var(--atlas);color:#fff;border-color:var(--atlas)}
  .primary:hover{filter:brightness(1.1)}
  .ghost{background:transparent}
  .mark{flex:1}
  .knew{border-color:var(--green);color:var(--green)}
  .knew:hover{background:rgba(192,229,133,.12)}
  .rev{border-color:var(--amber);color:var(--amber)}
  .rev:hover{background:rgba(242,166,90,.12)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .foot button{padding:6px 12px;font-size:12px}
  .hint{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:18px;letter-spacing:.03em}
  .summary{text-align:center;padding:38px 20px}
  .summary .big{font-family:var(--mono);font-size:46px;color:var(--green);font-weight:700}
  .summary .lbl{color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:24px}
  .summary .stat{display:flex;justify-content:center;gap:32px;margin:18px 0 28px;font-family:var(--mono)}
  .summary .stat div span{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
  .summary .stat .r{color:var(--amber)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:480px){.q{font-size:19px}.readout{font-size:13.5px}}
.srcbtn{background:transparent;border:1px solid var(--atlas);color:var(--breeze);border-radius:5px;padding:10px 14px;font-weight:700;font-family:var(--sans);cursor:pointer}
.srcbtn:hover{background:var(--atlas);color:#fff}
.srcpanel{max-height:0;overflow:hidden;opacity:0;background:#201B33;border:1px solid var(--line);border-radius:6px;padding:0 16px;margin-top:10px;transition:max-height .2s,opacity .2s,padding .2s}
.srcpanel.show{max-height:320px;opacity:1;padding:14px 16px}
.srclabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.srcref{font-family:var(--mono);font-size:14px;color:var(--breeze);font-weight:700}
.srcsub{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.gamelink{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--atlas);color:var(--breeze);border-radius:5px;padding:8px 12px;font-weight:700;font-size:12px;text-decoration:none;font-family:var(--sans);margin-left:8px}
.gamelink:hover{background:var(--atlas);color:#fff}
.handrow{flex-wrap:wrap;gap:8px}
</style>

<style>
.handout{display:inline-flex;align-items:center;gap:7px;background:var(--green);color:#1A1630;border:1px solid var(--green);border-radius:5px;padding:8px 13px;font-weight:700;font-size:12.5px;text-decoration:none;font-family:var(--sans);letter-spacing:.02em}
.handout:hover{filter:brightness(1.06)}
.handrow{display:flex;justify-content:flex-end;margin:-6px 0 14px}
.atbl{border-collapse:collapse;font-family:var(--mono);font-size:13px;margin:4px 0;width:100%}
.atbl th{background:var(--atlas);color:#fff;font-weight:700;padding:5px 10px;text-align:left;font-size:12px}
.atbl td{padding:4px 10px;border-bottom:1px solid #4A4460;color:#DCD8E6}
.atbl tr:nth-child(even) td{background:#120F1F}
.atbl .hi td{background:rgba(192,229,133,.14);color:#F1EEF6;font-weight:700}
.cat{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
</style>

<style>
.ps-homebar{align-self:stretch;width:100%;box-sizing:border-box;padding:8px 0 0 10px;flex:0 0 auto;text-align:left;}
.ps-home{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:#fff;border:2px solid #463C8F;color:#463C8F;text-decoration:none;box-shadow:0 1px 4px rgba(1,23,43,.2);transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent;}
.ps-home:hover,.ps-home:focus-visible{background:#463C8F;color:#fff;}
.ps-home:focus{outline:none;}
.ps-home svg{display:block;}
@media (max-width:480px){.ps-homebar{padding:6px 0 0 8px;}.ps-home{width:40px;height:40px;}}
</style>
<link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#463C8F">
</head>
<body>
<div class="ps-homebar"><a class="ps-home" href="/index.html" title="A330 Study Portal" aria-label="A330 Study Portal"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" focusable="false"><path d="M3 11.3 12 4l9 7.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.7 10.1v9.4h12.6v-9.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19.5v-5.1h4v5.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>

<div class="wrap">
  <header>
    <h1>A330 Weather <span class="sub">// Requirements</span></h1>
    <span class="src">FOM Rev 125.3</span>
  </header>
  <div class="handrow"><a class="handout" href="view.html?f=A330_Weather_Requirements.pdf" target="_blank" rel="noopener">&#128196; Open 2-page handout (PDF)</a><a class="gamelink" href="wx-alternate.html">&#127918; GAME</a></div>
  <div id="app"></div>
  <div class="hint">Answer aloud, then reveal to check &nbsp;&middot;&nbsp; Space / Enter = reveal then advance &nbsp;&middot;&nbsp; K = got it &nbsp;&middot;&nbsp; R = review &nbsp;&middot;&nbsp; Source = verbatim FOM quote</div>
</div>


<script>
/* bank(s) DATA live in data/, loaded here; engine below is unchanged */
Promise.all([fetch('data/weather.json',{cache:'no-store'}).then(r=>r.json())]).then(function(__b){
const [DATA]=__b;
if(!(Array.isArray(DATA)?DATA.length:Object.keys(DATA).length)){(document.getElementById('main')||document.getElementById('app')||document.getElementById('list')||document.getElementById('board')||document.body).innerHTML='<div class="card"><div class="summary"><div class="lbl">Bank not loaded yet</div><div class="srcsub">This bank is built in a later step. The engine is live.</div></div></div>';return;}


let order=[], idx=0, revealed=false, known=new Set(), review=new Set(), reviewMode=false, srcOpen=false;
const app=document.getElementById("app");
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ansHTML(d){
  let h = (d.a||[]).map(s=>`<div class="ln">${s}</div>`).join('');
  if(d.tbl){
    h += '<table class="atbl"><thead><tr><th>Fleet</th><th>Max distance</th></tr></thead><tbody>';
    h += d.tbl.map(r=>`<tr class="${r[2]?'hi':''}"><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
    h += '</tbody></table>';
  }
  return h;
}
function start(reviewOnly){
  reviewMode=reviewOnly;
  order= reviewOnly ? shuffle([...review]) : shuffle([...Array(DATA.length).keys()]);
  if(!reviewOnly){known=new Set();review=new Set();}
  idx=0;revealed=false;srcOpen=false;render();
}
function render(){
  if(idx>=order.length)return summary();
  const d=DATA[order[idx]];
  app.innerHTML=`
    <div class="bar">
      <span class="count">${idx+1} / ${order.length}</span>
      <div class="track"><div class="fill" style="width:${(idx/order.length)*100}%"></div></div>
      <span>${reviewMode?"REVIEW SET":"FULL SET"}</span>
    </div>
    <div class="card">
      <span class="chip">${d.ref}</span>
      <div class="prompt">
        <div class="cat">${d.cat}</div>
        <div class="lead">Answer aloud, then reveal to check</div>
        <div class="q">${d.q}</div>
      </div>
      <div class="readout${revealed?' show':''}">${ansHTML(d)}</div>
      <div class="srcpanel${srcOpen?' show':''}"><div class="srclabel">FOM Source &mdash; ${d.ref}</div><div class="srcsub" style="color:#DCD8E6;font-style:normal">&ldquo;${d.src}&rdquo;</div></div>
      <div class="spacer"></div>
      <div class="controls">
        ${revealed?`
          <button class="mark knew" onclick="grade(true)">Got it &nbsp;K</button>
          <button class="mark rev" onclick="grade(false)">Review &nbsp;R</button>
        `:`
          <button class="primary" style="flex:1" onclick="reveal()">Reveal answer</button>
        `}
        <button class="srcbtn" onclick="toggleSrc()">${srcOpen?'Hide source':'Source'}</button>
      </div>
    </div>
    <div class="foot">
      <button class="ghost" onclick="start(false)">Restart full set</button>
      <span>got it ${known.size} &middot; review ${review.size}</span>
    </div>`;
}
function reveal(){revealed=true;render()}
function toggleSrc(){srcOpen=!srcOpen;render()}
function grade(ok){const id=order[idx];if(ok){known.add(id);review.delete(id)}else{review.add(id)}idx++;revealed=false;srcOpen=false;render()}
function summary(){
  const pct=Math.round((known.size/DATA.length)*100);
  app.innerHTML=`
    <div class="card"><div class="summary">
      <div class="big">${pct}%</div>
      <div class="lbl">answered cold</div>
      <div class="stat">
        <div>${known.size}<span>got it</span></div>
        <div class="r">${review.size}<span>to review</span></div>
      </div>
      <div class="controls" style="justify-content:center">
        ${review.size?`<button class="primary" onclick="start(true)">Drill review only (${review.size})</button>`:''}
        <button class="ghost" onclick="start(false)">Restart full set</button>
      </div>
    </div></div>`;
}
document.addEventListener("keydown",e=>{
  if(idx>=order.length)return;
  if(e.code==="Space"||e.code==="Enter"){e.preventDefault();revealed?grade(true):reveal();}
  else if(e.key==="k"||e.key==="K"){if(revealed)grade(true)}
  else if(e.key==="r"||e.key==="R"){if(revealed)grade(false)}
});
start(false);
Object.assign(window,{ansHTML, grade, render, reveal, shuffle, start, summary, toggleSrc});
}).catch(function(e){(document.getElementById('main')||document.getElementById('app')||document.getElementById('list')||document.getElementById('board')||document.body).innerHTML='<div class="card"><div class="summary"><div class="lbl">Bank failed to load</div><div class="srcsub">'+e.message+'</div></div></div>';});
</script>

<footer style="width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:28px auto 0;">
<img src="assets/A330_hero.jpg" alt="Airbus A330" style="width:380px;max-width:60%;height:auto;border-radius:6px;">
<div style="width:100%;text-align:right;font-size:11px;color:#FF9080;font-family:inherit;">Ver 1.2</div>
</footer>
<script src="/portal-settings.js" defer></script>
<script src="/assist.js" defer></script>
</body>
</html>
