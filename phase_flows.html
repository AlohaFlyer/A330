<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A330 Flows">
<title>A330 Phase Flows</title>
<style>
:root{
  --blue:#CE0C88;--say:#c0392b;--trig:#e8590c;--cl:#7b2fb0;
  --bg:#F1EEF6;--card:#ffffff;--ink:#1E1A2E;--muted:#6F6B7E;--line:#E6E3EE;
  --head:#463C8F;--nav:#E9E5F1;--navbtn:#ffffff;--navink:#463C8F;--accent:#463C8F;
  --limbg:#fff1c4;--limink:#7a5600;--qbg:#F4F1F9;
}
body.dark{
  /* Jeppesen FD Pro dark palette, sampled from the airport moving map (Ryan, 2026-09-22):
     chrome #21232a, buttons #41434d, active blue #3579c1, map ground #0a1117, slate #35434d, labels yellow */
  --bg:#0a1117;--card:#1b232b;--ink:#f2f4f6;--muted:#9aa8b3;--line:#35434d;
  --head:#21232a;--nav:#0a1117;--navbtn:#21232a;--navink:#e6e9ec;--accent:#3579c1;
  --limbg:#3a3418;--limink:#f2d24c;--qbg:#14234c;--blue:#f2d24c;
}
body.dark .rtag.C{background:#41434d;}body.dark .it.fmc .stepn{background:#41434d;color:#f2d24c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:'Helvetica Neue',-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg);
display:flex;flex-direction:column;height:100vh;overflow:hidden;}
header{background:var(--head);color:#fff;
padding:calc(6px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));
display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 10px;flex:none;}
.hleft{display:flex;align-items:center;gap:10px;min-width:0;}
.back{display:inline-flex;align-items:center;gap:4px;color:#F1EEF6;font-weight:800;font-size:12.5px;
text-decoration:none;background:rgba(255,255,255,.16);padding:7px 11px;border-radius:8px;white-space:nowrap;}
.back:active{background:rgba(255,255,255,.28);}
header .ttl{font-size:17px;font-weight:800;letter-spacing:.3px;}
header .sub{font-size:10px;color:#EAE5F4;font-weight:600;margin-top:1px;}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}  /* the seat/mode toggles needed 429px in a 390px viewport and pushed the whole page sideways */
.toggle{display:flex;border-radius:8px;padding:3px;gap:2px;}
.toggle.seat{background:rgba(0,0,0,.28);}
.toggle.duty{background:rgba(0,45,33,.5);}
.toggle button{border:0;background:transparent;color:#EAE5F4;font-weight:800;font-size:14px;
padding:8px 17px;border-radius:6px;cursor:pointer;letter-spacing:.3px;}
.toggle.seat button.on{background:#fff;color:#463C8F;}
.toggle.duty button{color:#9fe0cd;}
.toggle.duty button.on{background:#37d9a8;color:#053b2c;}
.themebtn{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:17px;width:40px;height:40px;
border-radius:8px;cursor:pointer;}
.filt{width:auto;min-width:56px;padding:0 12px;font-size:12.5px;font-weight:800;letter-spacing:.4px;height:40px;}
.filt.on{background:#37d9a8;color:#053b2c;}
.gate{flex:none;display:flex;align-items:center;gap:10px;background:var(--cl);color:#fff;padding:6px calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left));}
.gate .lbl{font-size:10px;opacity:.85;font-weight:800;letter-spacing:.5px;}
.gate .nm{font-size:14.5px;font-weight:800;letter-spacing:.2px;}
.gate.none{display:none;}
main{flex:1;overflow:auto;padding:10px 12px 8px;display:flex;flex-direction:column;min-height:0;}
.phasehead{font-size:1.15em;font-weight:800;color:var(--ink);margin:0 2px 8px;display:flex;
align-items:baseline;gap:10px;flex-wrap:wrap;flex:none;}
.phasehead .src{font-size:.7em;font-weight:600;color:var(--muted);}
.phasehead.tinted{color:var(--pc);border-left:6px solid var(--pc);padding-left:10px;}
.gate.tinted{background:var(--pc);}
nav button[data-pc],.rail button[data-pc]{color:var(--pc);border-color:var(--pc);}
nav button[data-pc].on,.rail button[data-pc].on{background:var(--pc);color:#fff;border-color:var(--pc);}
.grid{font-size:15px;column-gap:11px;flex:1;min-height:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;
margin:0 0 11px;display:block;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.05);
break-inside:auto;-webkit-column-break-inside:auto;}
.card .ch{border-radius:8px 8px 0 0;break-inside:avoid;break-after:avoid;}
.cb{break-before:avoid;}
.it,.trig,.cl,.clwrap,.book,.sub,.note{break-inside:avoid;-webkit-column-break-inside:avoid;}
.card.mem{break-inside:avoid;-webkit-column-break-inside:avoid;}
.card .ch{background:var(--head);color:#fff;font-weight:800;font-size:.85em;letter-spacing:.3px;
display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:6px solid var(--ec,#888);}
.card .ch .hn{padding:6px 0 6px 9px;}
.cardcite{font-size:.62em;font-weight:600;opacity:.82;white-space:nowrap;letter-spacing:.2px;padding-right:9px;}
.cb{padding:5px 9px 7px;}
.it{display:flex;gap:7px;align-items:flex-start;padding:4px 0;border-top:1px solid var(--line);}
.it:first-child{border-top:none;}
.stepn{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--line);color:var(--muted);
font-size:.62em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:.2em;}
.it .body{flex:1;min-width:0;}
.it .t{font-weight:800;font-size:.85em;}
.it .s{font-size:.78em;color:var(--muted);margin-top:1px;}
.it.fmc .stepn{background:#EAE5F4;color:#463C8F;}.it.fmc .t{color:var(--blue);}
.it.say .t{color:var(--say);}
.sayb{color:var(--say);font-weight:800;margin-right:3px;}
.it.say .stepn{background:#fbdcd7;color:var(--say);}
.it.dim{opacity:.32;}
.rtag{display:inline-block;font-size:.62em;font-weight:800;color:#fff;border-radius:7px;
padding:1px 5px;margin-left:6px;vertical-align:middle;}
.rtag.C{background:#463C8F;}.rtag.F{background:#CE0C88;}.rtag.PF{background:#00805E;}.rtag.PM{background:#5f3dc4;}
.lim{background:var(--limbg);color:var(--limink);font-weight:800;border-radius:3px;padding:0 3px;}
.trig{display:flex;gap:8px;align-items:center;background:rgba(232,89,12,.13);border:1px solid rgba(232,89,12,.4);
border-left:5px solid var(--trig);color:var(--trig);font-weight:800;border-radius:6px;
padding:6px 9px;margin:5px 0;font-size:.85em;}
.trig .ic{font-size:1.05em;flex:none;}
.cl{display:flex;gap:9px;align-items:center;background:rgba(123,47,176,.13);border:1px solid rgba(123,47,176,.42);
border-left:6px solid var(--cl);color:var(--cl);font-weight:800;border-radius:6px;
padding:8px 10px;margin:6px 0;font-size:.92em;}
.cl.cc{background:rgba(34,139,72,.14);border-color:rgba(34,139,72,.5);border-left-color:#22a35a}
.clcc{margin-top:6px;padding:5px 9px;font-weight:800;font-size:12px;letter-spacing:.4px;color:#166534;background:rgba(34,139,72,.12);border-radius:6px;text-transform:uppercase}
.cl.bold{background:rgba(123,47,176,.22);}
.cl.bold.cc{background:rgba(34,139,72,.14);border-color:rgba(34,139,72,.5);border-left-color:#22a35a}
.cl .ic{font-size:1.1em;flex:none;}
.cl .w{display:block;color:var(--muted);font-style:italic;font-weight:600;font-size:.68em;margin-top:1px;}
.book{background:rgba(120,130,140,.1);border-left:5px solid #6F6B7E;border-radius:6px;padding:5px 9px;margin:5px 0;}
.book .t{font-weight:800;font-size:.85em;}.book .s{font-size:.78em;color:var(--muted);margin-top:1px;}
.sub{color:#fff;font-weight:800;font-size:.72em;padding:3px 8px;border-radius:5px;margin:7px 0 3px;letter-spacing:.3px;}
.sub.has-sub{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sub .subx{font-size:1em;opacity:.9;transition:transform .12s;}
.subgrp.open .sub .subx{transform:rotate(90deg);}
.subbody{display:none;}
.subgrp.open .subbody{display:block;}
.note{font-size:.78em;color:var(--muted);font-style:italic;margin:3px 0;padding-left:2px;}
.tech{background:rgba(10,143,176,.14);border:1px solid rgba(10,143,176,.42);border-left:5px solid #CE0C88;
color:#831A57;border-radius:6px;padding:5px 9px;margin:4px 0;font-weight:800;font-size:1.02em;break-inside:avoid;}
body.dark .tech{color:#f2d24c;}
body.dark nav button[data-pc]:not(.on),body.dark .rail button[data-pc]:not(.on){color:var(--pcl);border-color:var(--pcl);}
body.dark .phasehead.tinted{color:var(--pcl);border-left-color:var(--pcl);}
body.dark .cl{color:#f2d24c;border-left-color:#f2d24c;background:rgba(242,210,76,.10);border-color:rgba(242,210,76,.4);}
body.dark .cl.cc{color:#8fe3b0;border-left-color:#8fe3b0;}
body.dark .clcc{color:#8fe3b0;}
body.dark .it.fmc .t{color:#f2d24c;}
body.dark .exp{color:#f2d24c;border-color:#f2d24c;}
.lt,.lt b{color:#00805E;}body.dark .lt,body.dark .lt b{color:#73d0b0;}
.tech .tl{display:block;font-size:.72em;letter-spacing:.6px;opacity:.75;margin-bottom:1px;}
ul.bl li.techli{padding-left:0;}
ul.bl li.techli::before{content:none;}
.it.has-q{cursor:pointer;}
.qbox{display:none;margin:5px 0 2px;padding:7px 9px;background:var(--qbg);border:1px solid var(--line);
border-left:4px solid var(--accent);border-radius:5px;font-size:.78em;color:var(--ink);line-height:1.38;}
.it.open .qbox{display:block;}
.qbox .qsrc{display:block;font-weight:800;color:var(--accent);font-size:1em;margin-bottom:3px;letter-spacing:.2px;}
.qbox .qt{font-style:italic;}
.empty{color:var(--muted);font-style:italic;padding:20px;}
nav{flex:none;background:var(--nav);border-top:1px solid var(--line);position:relative;
padding:7px calc(8px + env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;white-space:nowrap;display:flex;gap:6px;align-items:stretch;
scroll-behavior:smooth;touch-action:pan-x;scrollbar-width:none;scroll-snap-type:x proximity;gap:12px;}
nav::-webkit-scrollbar{display:none;}
.npag{position:sticky;flex:none;align-self:stretch;width:52px;min-width:52px;border:0;cursor:pointer;padding:0;
background:var(--nav);color:var(--head);font-size:23px;font-weight:900;z-index:6;display:flex;align-items:center;justify-content:center;}
.npag.l{left:0;box-shadow:8px 0 10px -4px rgba(0,0,0,.3);border-radius:0 10px 10px 0;}
.npag.r{right:0;box-shadow:-8px 0 10px -4px rgba(0,0,0,.3);border-radius:10px 0 0 10px;}
.npag.gone{display:none;}
.navlabel{font-size:9px;font-weight:800;color:var(--muted);align-self:center;margin-right:2px;letter-spacing:.4px;}
nav .divider{width:2px;background:var(--line);margin:0 5px;border-radius:2px;}
nav button{flex:none;border:1.5px solid transparent;background:var(--navbtn);color:var(--navink);font-weight:800;
font-size:15px;padding:0 16px;min-height:44px;border-radius:22px;cursor:pointer;letter-spacing:.2px;scroll-snap-align:center;}
nav button.ab{color:var(--say);}
nav button.on{background:var(--head);color:#fff;}
nav button.ab.on{background:var(--say);color:#fff;}
.arrow{position:fixed;top:50%;transform:translateY(-50%);width:42px;height:60px;border:0;cursor:pointer;
background:var(--head);color:#fff;font-size:26px;font-weight:800;z-index:30;opacity:.85;
box-shadow:0 2px 7px rgba(0,0,0,.3);}
.arrow.prev{left:env(safe-area-inset-left);border-radius:0 10px 10px 0;}.arrow.next{right:env(safe-area-inset-right);border-radius:10px 0 0 10px;}
@media (max-width:600px){.arrow{display:none;}}
#fit{min-width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;}
@media (max-width:600px){#fit{display:none;}}  /* a phone always reads vertically; FIT is a Mac/iPad control (the media rule must come after the base rule) */  /* fixed side arrows covered a quarter of the phone column */
.morecue{position:fixed;z-index:24;width:42px;pointer-events:none;display:none;}
.morecue.show{display:none;}
.morecue.r{background:linear-gradient(to right,rgba(127,127,127,0),rgba(127,127,127,.22));}
.morecue.l{background:linear-gradient(to left,rgba(127,127,127,0),rgba(127,127,127,.22));}
.morecue .chev{position:absolute;top:14%;width:30px;height:30px;border-radius:50%;background:var(--accent);
color:#fff;font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.35);}
.morecue.r .chev{right:5px;animation:cueR 1.3s ease-in-out infinite;}
.morecue.l .chev{left:5px;animation:cueL 1.3s ease-in-out infinite;}
@keyframes cueR{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes cueL{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.apprwrap{display:flex;gap:8px;align-items:center;}
.toggle.appr{background:rgba(120,70,0,.45);}
.toggle.appr button{color:#f3d4a2;}
.toggle.appr button.on{background:#e8a13a;color:#3a2400;}
.toggle.cat{background:rgba(120,70,0,.3);}
.toggle.cat button{color:#f3d4a2;padding:8px 13px;}
.toggle.cat button.on{background:#f3c477;color:#3a2400;}
ul.bl{margin:2px 0 0;padding:0;list-style:none;}
ul.bl li{font-size:.78em;color:var(--muted);line-height:1.28;padding-left:13px;position:relative;margin:1.5px 0;}
ul.bl li::before{content:'•';position:absolute;left:3px;color:var(--accent);font-weight:800;}
ul.bl li b{color:var(--ink);} .co{color:var(--say);}
    ul.bl ul.sub{list-style:none;margin:2px 0 3px 12px;padding:0;} ul.bl ul.sub li{position:relative;padding-left:12px;font-size:13px;font-weight:400;} ul.bl ul.sub li::before{content:"–";position:absolute;left:0;opacity:.65;}
.exp{display:inline-block;color:var(--accent);font-size:.62em;font-weight:800;margin-left:6px;
border:1.4px solid var(--accent);border-radius:5px;padding:0 5px;vertical-align:middle;opacity:.85;}
.it.open .exp,.clwrap.open .exp{background:var(--accent);color:#fff;}
.clwrap{margin:6px 0;}
.cl.has-cl{cursor:pointer;margin:0;}
.cl .cln{flex:1;}
.clbody{display:none;border:1px solid rgba(123,47,176,.32);border-top:0;border-radius:0 0 7px 7px;
background:var(--card);padding:3px 9px 6px;}
.clwrap.open .clbody{display:block;}
.cli{display:flex;align-items:baseline;gap:7px;font-size:.78em;padding:3px 0;border-top:1px solid var(--line);}
.cli:first-child{border-top:0;}
.cli .cii{font-weight:800;color:var(--ink);}
.cli .civ{flex:1;color:var(--muted);}
.cli.dim{opacity:.32;}
/* compact mode: hide verbose detail on dense phases (keep callouts + open items) */
.grid.compact .it:not(.say):not(.open) .s,
.grid.compact .it:not(.say):not(.open) ul.bl,
.grid.compact .note{display:none;}
.rail{display:none;}
.rail .navlabel{display:block;margin:7px 4px 3px;}
.rail button{flex:none;border:1.5px solid transparent;background:var(--navbtn);color:var(--navink);
font-weight:800;font-size:13.5px;padding:10px 11px;border-radius:9px;cursor:pointer;text-align:left;width:100%;letter-spacing:.2px;}
.rail button.ab{color:var(--say);}
.rail button.on{background:var(--head);color:#fff;}
.rail button.ab.on{background:var(--say);color:#fff;}
.rail{display:none !important;}

.notesbtn{width:auto;min-width:60px;padding:0 12px;font-size:11px;font-weight:800;letter-spacing:.3px;
height:40px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;cursor:pointer;}
.notesbtn.on{background:#37d9a8;color:#053b2c;}
.qref{position:fixed;inset:0;z-index:80;background:#E4E0EE;display:flex;flex-direction:column;}
.qref[hidden]{display:none;}
.qref .qbar{flex:none;display:flex;align-items:center;gap:10px;background:#463C8F;color:#fff;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;}
.qref .qbar button,.qref .qbar a{height:36px;line-height:36px;padding:0 12px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:12px;letter-spacing:.3px;cursor:pointer;text-decoration:none;font-family:inherit;}
.qref .qbar .qttl{flex:1;text-align:center;font-weight:800;font-size:12px;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qref .qpages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
.qref .qpages img{display:block;width:100%;max-width:1100px;margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px rgba(30,26,46,.25);}
.qref.dark{background:#111015;}
.qref.dark .qpages img{filter:invert(1) hue-rotate(180deg);box-shadow:none;}
ol.cl-order{margin:2px 0 0;padding-left:20px;}
ol.cl-order li{font-size:.85em;font-weight:700;color:var(--ink);padding:3px 0;border-bottom:1px solid var(--line);}
ol.cl-order li:last-child{border-bottom:none;}
.grid.notesmode{cursor:pointer;}
</style>
<style>
.ps-homebar{align-self:stretch;width:100%;box-sizing:border-box;padding:8px 0 0 10px;flex:0 0 auto;text-align:left;}
.ps-home{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:#fff;border:2px solid #463C8F;color:#463C8F;text-decoration:none;box-shadow:0 1px 4px rgba(1,23,43,.2);transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent;}
.ps-home:hover,.ps-home:focus-visible{background:#463C8F;color:#fff;}
.ps-home:focus{outline:none;}
.ps-home svg{display:block;}
@media (max-width:480px){.ps-homebar{padding:6px 0 0 8px;}.ps-home{width:40px;height:40px;}}
</style>
<link rel="apple-touch-icon" href="/assets/icons/icon-180.png">

<body>
<div class="ps-homebar"><a class="ps-home" href="/index.html" title="A330 Study Portal" aria-label="A330 Study Portal"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" focusable="false"><path d="M3 11.3 12 4l9 7.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.7 10.1v9.4h12.6v-9.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 19.5v-5.1h4v5.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>

<header>
  <div class="hleft">
    <div class="htitle">
      <div class="ttl">A330 Phase Flows</div>
      <div class="sub" id="srcsub"></div>
    </div>
  </div>
  <div class="ctrls">
    <button class="notesbtn" id="notesBtn" title="Quick Reference Notes">NOTES</button>
    <button class="notesbtn" id="qrefBtn" title="A330 OEM Quick Reference card">QUICK REF</button>
    <div class="toggle seat" id="seat">
      <button data-s="C">CM1 (CA)</button>
      <button data-s="F" class="on">CM2 (FO)</button>
    </div>
    <div class="toggle duty" id="duty">
      <button data-d="PF" class="on">PF</button>
      <button data-d="PM">PM</button>
    </div>
    <div class="apprwrap" id="apprwrap" style="display:none">
      <div class="toggle appr" id="appr">
        <button data-a="ILS" class="on">ILS</button>
        <button data-a="RNP">RNP&nbsp;APCH</button>
        <button data-a="NPA">NPA</button>
      </div>
      <div class="toggle cat" id="cat">
        <button data-c="1" class="on">I</button>
        <button data-c="2">II</button>
        <button data-c="3">III</button>
      </div>
    </div>
    <button class="themebtn filt" id="filt" title="Show or hide the other crew member's steps">BOTH</button>
    <button class="themebtn filt" id="fit" title="Fit the page to the screen, or scroll it at reading size"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"/><path d="M4 4h6M4 4v6M20 4h-6M20 4v6M4 20h6M4 20v-6M20 20h-6M20 20v-6"/></svg></button>
    <button class="themebtn" id="theme" title="Day / Night">&#9790;</button>
  </div>
</header>

<div class="qref" id="qref" hidden>
  <div class="qbar"><button id="qrefBack" type="button">&#9664; Back</button><span class="qttl">A330 OEM QUICK REFERENCE</span><button id="qrefTheme" type="button" title="Day / Night">&#9790;</button><a href="/A330_OEM_Quick_Reference.pdf" target="_blank" rel="noopener">PDF</a></div>

<main id="main"></main>

<button class="arrow next" id="next" aria-label="Next phase">&#8250;</button>

<div class="morecue r" id="cueR"><span class="chev">&#8250;</span></div>

<script>
/* bank PHASE_FLOWS lives in data/phase_flows.json, loaded here; engine below is unchanged */
Promise.all([fetch('data/phase_flows.json',{cache:'no-store'}).then(r=>r.json())]).then(function(__b){
const [PHASE_FLOWS]=__b;
const box=(t,s,r,call,q)=>({k:'box',t,s:s||'',r:r||'B',call:!!call,q:q||''});
const fmc=(t,s,r,q)=>({k:'box',t,s:s||'',r:r||'B',fmc:true,q:q||''});
const sub=(t,c)=>({k:'sub',t,c});
const trig=(t,r)=>({k:'trig',t,r:r||'B'});
const cl=(t,w,bold,cc)=>({k:'cl',t,w:w||'',bold:!!bold,cc:!!cc});
const book=(t,s)=>({k:'book',t,s:s||''});
const note=(t)=>({k:'note',t});
const S=(h,c,items,cite,appr)=>({h,c,items,cite:cite||'',appr:appr||'all'});

/* phase records, checklists, quotes and NOTES live in data/phase_flows.json and are rebuilt
   here through the builders above; nothing else in this script changes (see build_scripts/page_phase_flows.py) */
const __mk=it=>{ const q=it.quote?it.quote+(it.ref?' ['+it.ref+']':''):'';
  switch(it.k){
    case 'box': return box(it.t,it.s,it.r,it.call,q);
    case 'fmc': return fmc(it.t,it.s,it.r,q);
    case 'sub': return sub(it.t,it.c);
    case 'trig': return trig(it.t,it.r);
    case 'cl': return cl(it.t,it.w,it.bold,it.cc);
    case 'book': return book(it.t,it.s);
    default: return note(it.t||'');
  } };
const PHASES=PHASE_FLOWS.phases.map(p=>({id:p.id,label:p.label,kind:p.kind,title:p.title,src:p.src,
  sections:p.sections.map(s=>Object.assign(S(s.h,s.c,s.items.map(__mk),s.cite,s.appr),s.mem?{mem:true}:{}))}));
const VERSIONS="FCOM R17 · QRH R35 · FCTM R6 · FOM 125.3 · PRC 31 AUG 26";
document.getElementById('srcsub').textContent=VERSIONS;
const QUOTES=PHASE_FLOWS.quotes||{};
const NOTES=PHASE_FLOWS.notes||[];



const CHECKLISTS=Object.fromEntries(Object.entries(PHASE_FLOWS.checklists).map(([k,v])=>[k,v.items]));
let state={phase:'preflight',seat:'F',duty:'PM',appr:'ILS',cat:1,hideOther:false,notesOpen:false,fit:true};
function roleMatch(r){
  if(!r||r==='B')return true;
  if(r==='C')return state.seat==='C';
  if(r==='F')return state.seat==='F';
  if(r==='PF')return state.duty==='PF';
  if(r==='PM')return state.duty==='PM';
  return true;
}
function apprVisible(a){
  if(!a||a==='all')return true;
  if(a==='ILScat')return state.appr==='ILS'&&state.cat>=2;
  return state.appr===a;
}
const RTAG={C:'CA',F:'FO',PF:'PF',PM:'PM'};
function rtagHtml(r){ return RTAG[r]?`<span class="rtag ${r}">${RTAG[r]}</span>`:''; }
const LIM=/(40°C|FL\d{3}|VREF\d*|RNP ?[0-9.]+|V1|VR|V2|MORA|MOCA|10,000 ft|10 000 ft(?: MSL| AAL)?|18,000|18 000 ft(?: MSL)?|FL180|FL100|300 ft|500 ft|400 ft|200 ft|75 ft|80 KIAS|60 KIAS|7700|121\.5|123\.45|5 nm|2 nm|1 × RNP|0\.10|30°)/g;
function hl(s){ return s? s.replace(LIM,'<span class="lim">$1</span>') : ''; }
function boldCO(s){ return s.replace(/[“"]([^”"]*)[”"]/g,'<b class="co">“$1”</b>'); }
const STATES=/\b(ON|OFF|AUTO|SET|UP|DN|DOWN|CUTOFF|RUN|ARM|ARMED|RTO|STBY|STANDBY|XPDR|TA\/RA|NORM|CLOSED|OPEN)\b/g;
function boldST(s){ return s.replace(STATES,'<b>$1</b>'); }
const LIGHTS=/((?:NOSE|STROBE|BEACON|WING|LAND(?: LIGHT)?|RWY TURN OFF|NAV & LOGO|Rwy Turnoff|Strobes|Nose|Land|Nav|Beacon|Wing)(?: sw)?(?: \.\.\. | )(?:ON|OFF|TAXI|T\.O\.?|AUTO|1|AS RQRD))(?![\w])/g;
function lights(s){ return s.replace(LIGHTS,"<span class='lt'>$1</span>"); } // single quotes: boldCO turns double quotes into callouts
function deco(s){ return s? hl(boldST(boldCO(lights(s)))) : ''; }
function bullets(s){ if(!s)return ''; const p=s.split(' · '); if(p.length<2 && !s.includes(' » '))return `<div class="s">${deco(s)}</div>`;
  return `<ul class="bl">${p.map(x=>{ if(x.startsWith('TECH:')){ return `<li class="techli"><div class="tech"><span class="tl">TECHNIQUE</span>${deco(x.slice(5).trim())}</div></li>`; } if(x.includes(' » ')){ const pt=x.split(' » '); const kids=pt[1].split(' ; ').map(k=>`<li>${deco(k.trim())}</li>`).join(''); return `<li>${deco(pt[0].trim()).replace(/\((\d+)\)/,'<b>($1)</b>')}<ul class="sub">${kids}</ul></li>`; } return `<li>${deco(x)}</li>`; }).join('')}</ul>`; }
const EXP='<span class="exp">&#9656;</span>';

function renderItem(it,cite,ctx,pid){
  if(it.k==='sub') return `<div class="sub" style="background:${it.c}">${it.t}</div>`;
  if(it.k==='note') return `<div class="note">${deco(it.t)}</div>`;
  if(it.k==='book') return `<div class="book"><div class="t">${it.t}</div>${bullets(it.s)}</div>`;
  if(it.k==='trig'){ if(!roleMatch(it.r)&&state.hideOther)return ''; const dim=!roleMatch(it.r)?' dim':'';
    return `<div class="trig${dim}"><span class="ic">&#9654;</span><span>${deco(it.t)}</span></div>`; }
  if(it.k==='cl'){ const items=CHECKLISTS[it.t]||[];
    const w=it.w?`<span class="w">when: ${deco(it.w)}</span>`:'';
    const clTag=r=>r==='B'?rtagHtml('PF')+rtagHtml('PM'):rtagHtml(r); // BOTH rows: both responders shown
    const body=items.map(ci=>`<div class="cli${roleMatch(ci[2])?'':' dim'}"><span class="cii">${ci[0]}</span><span class="civ">${deco(ci[1])}</span>${clTag(ci[2])}</div>`).join('')||'<div class="cli">(reference)</div>';
    return `<div class="clwrap"><div class="cl${it.bold?' bold':''}${it.cc?' cc':''} has-cl"><span class="ic">&#10003;</span><span class="cln">${it.t} Checklist${w}</span>${EXP}</div><div class="clbody">${body}${it.cc?'<div class="clcc">PM: __ CHECKLIST COMPLETE</div>':''}</div></div>`; }
  if(it.k==='box'){ const match=roleMatch(it.r); if(!match&&state.hideOther)return ''; const dim=match?'':' dim'; const n=ctx.n++;
    const q=it.q || (typeof QUOTES!=='undefined' ? (QUOTES[pid+'|'+it.t]||'') : '');
    const cls='it'+(it.call?' say':'')+(it.fmc?' fmc':'')+(q?' has-q':'')+dim;
    const sayb=it.call?'<span class="sayb">&#10078;</span>':'';
    const stag=((cite||'').trim().split(/[\s·\/]+/).filter(Boolean)[0]||'ref').replace(/[^A-Za-z0-9.]/g,'');
    const badge=q?`<span class="exp">${stag} &#9656;</span>`:'';
    const t=`<div class="t">${sayb}${deco(it.t)}${rtagHtml(it.r)}${badge}</div>`;
    const qb=q?`<div class="qbox"><span class="qsrc">${cite}</span><span class="qt">${q}</span></div>`:'';
    return `<div class="${cls}"><div class="stepn">${n}</div><div class="body">${t}${bullets(it.s)}${qb}</div></div>`; }
  return '';
}
function gateFor(ph){
  const names=[];
  ph.sections.forEach(s=>{ if(apprVisible(s.appr)) s.items.forEach(it=>{ if(it.k==='cl') names.push(it.t+' Checklist'); }); });
  return [...new Set(names)];
}
function secVisible(sec){
  // role-carrying items of a section that match the current seat/duty (2026-09-21, MINE fix)
  const roled = sec.items.filter(it=>['box','fmc','trig','cl','book'].includes(it.k) && it.r);
  const steps = sec.items.filter(it=>['box','fmc','book'].includes(it.k) ? roleMatch(it.r) : it.k==='cl');
  return {roled: roled.length, vis: roled.filter(it=>roleMatch(it.r)).length, n: steps.length};
}
function secHead(sec){
  const v = secVisible(sec);
  if(!sec.mem || !v.vis) return sec.h;
  let h = sec.h.replace(/(·\s*)(\d+)\s*$/, (m,a)=>a+v.n);
  if(state.seat==='C') h = h.replace(/^CM2 · /, 'CM1 · '); // the seat-indexed groups read as the seat being viewed
  return h;
}
function sectionInner(sec,cite,ctx,pid){
  if(!sec.items.some(it=>it.k==='sub')) return sec.items.map(it=>renderItem(it,cite,ctx,pid)).join('');
  let out='',open=false;
  sec.items.forEach(it=>{
    if(it.k==='sub'){
      if(open)out+='</div></div>';
      out+=`<div class="subgrp"><div class="sub has-sub" style="background:${it.c}"><span>${it.t}</span><span class="subx">&#9656;</span></div><div class="subbody">`;
      open=true;
    } else out+=renderItem(it,cite,ctx,pid);
  });
  if(open)out+='</div></div>';
  return out;
}
let CARDS=[];
function render(){
  if(state.notesOpen){ renderNotes(); return; }
  const ph=PHASES.find(p=>p.id===state.phase);
  const main=document.getElementById('main');
  const ctx={n:1};
  CARDS=[];
  ph.sections.forEach(sec=>{
    if(!apprVisible(sec.appr))return;
    { const v=secVisible(sec); if(state.hideOther && v.roled && !v.vis) return; }
    const cite=sec.cite||ph.src;
    const inner=sectionInner(sec,cite,ctx,ph.id);
    CARDS.push(`<div class="card${sec.mem&&sec.items.length<=5?' mem':''}"><div class="ch" style="--ec:${sec.c}${sec.mem?`;background:${sec.c}`:``}"><span class="hn">${secHead(sec)}</span><span class="cardcite">${cite}</span></div><div class="cb">${inner}</div></div>`);
  });
  const pc=phaseColor(ph.id);
  main.innerHTML=`<div class="phasehead${pc?` tinted`:``}"${pc?` style="${pcStyle(pc)}"`:``}>${ph.title}<span class="src">${ph.src}</span></div><div class="grid" id="grid"></div>`;
  const g=document.getElementById('gate'); const gn=gateFor(ph);
  if(pc){ g.style.setProperty('--pc',pc); g.style.setProperty('--pcl',lighten(pc)); } else { g.style.removeProperty('--pc'); g.style.removeProperty('--pcl'); }
  if(gn.length){ g.className='gate'+(pc?' tinted':''); g.innerHTML=`<span class="lbl">GATE</span><span class="nm">&#10003; ${gn.join('  ·  ')}</span>`; }
  else g.className='gate none';
  const showAppr=ph.id==='landing';
  document.getElementById('apprwrap').style.display=showAppr?'flex':'none';
  document.getElementById('cat').style.display=(showAppr&&state.appr==='ILS')?'flex':'none';
  document.querySelectorAll('#nav button, #rail button').forEach(b=>b.classList.toggle('on',b.dataset.p===state.phase));
  { const pi=PHASES.findIndex(p=>p.id===state.phase); document.getElementById('prev').style.visibility=pi>0?'':'hidden'; document.getElementById('next').style.visibility=pi<PHASES.length-1?'':'hidden'; } // arrows only where a phase exists that way
  saveState();
  fitToScreen();
}
function saveState(){ try{localStorage.setItem('a330state',JSON.stringify({phase:state.phase,seat:state.seat,duty:state.duty,appr:state.appr,cat:state.cat,hideOther:state.hideOther}));}catch(e){} }
// Flowing N-column layout (CSS multicol): content flows column to column to fill white space,
// breaking only BETWEEN steps (never mid-step). One consistent font for EVERY phase, sized so the
// busiest page fits; sparse pages use the same font. Recomputed when geometry or the hide-other toggle changes.
const FLOOR=11, MAXF=18;
let GFONT=0, lastW=0, lastH=0, lastHide=null;
function cardsFor(pid){
  const ph=PHASES.find(p=>p.id===pid); if(!ph)return [];
  const ctx={n:1}; const out=[];
  ph.sections.forEach(sec=>{ if(!apprVisible(sec.appr))return; { const v=secVisible(sec); if(state.hideOther && v.roled && !v.vis) return; } const cite=sec.cite||ph.src;
    const inner=sectionInner(sec,cite,ctx,ph.id);
    out.push(`<div class="card${sec.mem&&sec.items.length<=5?' mem':''}"><div class="ch" style="--ec:${sec.c}${sec.mem?`;background:${sec.c}`:``}"><span class="hn">${secHead(sec)}</span><span class="cardcite">${cite}</span></div><div class="cb">${inner}</div></div>`);
  });
  return out;
}
function applyCols(grid,cardsHTML,ncol,fontPx){
  grid.style.display='block'; grid.style.columnCount=ncol; grid.style.columnGap='11px'; grid.style.fontSize=fontPx+'px';
  grid.innerHTML=cardsHTML.join('');
  return grid.scrollHeight;
}
function notesCards(){
  const c=(h,ec,body)=>`<div class="card"><div class="ch" style="--ec:${ec}"><span class="hn">${h}</span></div><div class="cb">${body}</div></div>`;
  const bl=(arr)=>`<ul class="bl">${arr.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  const tg=(t)=>`<div class="trig"><span class="ic">&#10148;</span><span>${t}</span></div>`;
  return NOTES.map(n=> n.k==='tg' ? tg(n.t) : n.k==='ol' ? c(n.h,n.ec,'<ol class="cl-order">'+n.items.map(x=>`<li>${x}</li>`).join('')+'</ol>') : c(n.h,n.ec,bl(n.items)));
}
function fitNotesToScreen(){
  const grid=document.getElementById('grid'); if(!grid)return;
  const main=document.getElementById('main'); const phh=document.querySelector('.phasehead'); if(!phh)return;
  const avail=main.clientHeight - phh.offsetHeight - 12; if(avail<=4)return;
  const W=grid.clientWidth||main.clientWidth;
  if(readMode(W)){ applyRead(grid,CARDS,W,avail); requestAnimationFrame(positionCues); return; } unRead(grid);
  const ncol=colsForWidth(W);
  const f=bestFontFor(CARDS,ncol,avail,grid);
  applyCols(grid,CARDS,ncol,f);
  requestAnimationFrame(positionCues);
}
function renderNotes(){
  const main=document.getElementById('main');
  main.innerHTML=`<div class="phasehead">NOTES<span class="src">tap anywhere to close</span></div><div class="grid notesmode" id="grid"></div>`;
  CARDS=notesCards();
  document.getElementById('gate').className='gate none';
  document.getElementById('apprwrap').style.display='none';
  document.querySelectorAll('#nav button, #rail button').forEach(b=>b.classList.remove('on'));
  document.getElementById('notesBtn').classList.add('on');
  fitNotesToScreen();
}
function openNotes(){
  state.notesOpen=true;
  document.getElementById('prev').style.display='none';
  document.getElementById('next').style.display='none';
  render();
}
function closeNotes(){
  state.notesOpen=false;
  document.getElementById('notesBtn').classList.remove('on');
  document.getElementById('prev').style.display='';
  document.getElementById('next').style.display='';
  render(); scrollActive();
}
function fitCurrent(){ if(state.notesOpen) fitNotesToScreen(); else fitToScreen(); }

function bestFontFor(cardsHTML,ncol,avail,grid){ for(let f=MAXF;f>FLOOR;f--){ if(applyCols(grid,cardsHTML,ncol,f)<=avail) return f; } return FLOOR; }
function computeGFont(ncol,avail,grid){
  const cand=['preflight','before-takeoff','after-takeoff','cruise','descent','approach','landing','memory','limitations','oceanic','etops','diversion'];
  let g=MAXF;
  for(const pid of cand){ const c=cardsFor(pid); if(!c.length)continue; const f=bestFontFor(c,ncol,avail,grid); if(f<g)g=f; }
  return g;
}
// One column on a phone. The old 340px breakpoint put two columns on a
// 366px main, and the auto-sizer then floored body text at 8.6px.
function colsForWidth(W){ return W>=1100?4 : W>=820?3 : W>=600?2 : 1; }
function readMode(W){ return !state.fit || colsForWidth(W)===1; }
function applyRead(grid,cards,W,avail){ const phone=colsForWidth(W)===1; const ncol=phone?1:Math.min(colsForWidth(W),Math.max(1,cards.length)); grid.style.flex=phone?'0 0 auto':''; const sparse=!phone && cards.length<colsForWidth(W); const lock=!phone && !sparse; grid.style.height=lock?avail+'px':''; grid.style.columnFill=lock?'auto':''; grid.style.flex=lock?'':'0 0 auto'; grid.style.minHeight=''; grid.style.maxWidth=sparse?(ncol*640)+'px':''; grid.style.margin=sparse?'0':''; applyCols(grid,cards,ncol,16); } // sparse pages (fewer cards than columns) are column-width, left-justified and scroll down instead of sideways // FIT off: phone scrolls down; Mac/iPad keep 16 px, the height lock and the columns continuing to the right (Ryan, 2026-09-22)
function unRead(grid){ grid.style.flex='0 0 auto'; grid.style.height=''; grid.style.columnFill=''; } // fit mode too lets the grid grow: multicol balances its columns and only the font shrinks to fit, never extra columns off to the right (Ryan, 2026-09-22)
function fitToScreen(){
  const grid=document.getElementById('grid'); if(!grid||!CARDS.length)return;
  const main=document.getElementById('main'); const phh=document.querySelector('.phasehead'); if(!phh)return;
  const avail=main.clientHeight - phh.offsetHeight - 12; if(avail<=4)return;
  const W=grid.clientWidth||main.clientWidth;
  if(readMode(W)){ applyRead(grid,CARDS,W,avail); requestAnimationFrame(positionCues); return; } unRead(grid);
  const ncol=Math.min(colsForWidth(W), Math.max(1, CARDS.length)); // never more columns than cards (Ryan, 2026-09-22)
  if(!GFONT || Math.abs(W-lastW)>6 || Math.abs(avail-lastH)>6 || lastHide!==state.hideOther){ GFONT=computeGFont(ncol,avail,grid); lastW=W; lastH=avail; lastHide=state.hideOther; }
  const sparse = CARDS.length < colsForWidth(W); grid.style.maxWidth = sparse ? (ncol*640)+'px' : ''; grid.style.margin = sparse ? '0' : ''; // sparse pages: column-width cards, left-justified (Ryan, 2026-09-22)
  { let f = sparse ? bestFontFor(CARDS,ncol,avail,grid) : GFONT; let h=applyCols(grid,CARDS,ncol,f); while(h>avail && f>FLOOR){ f-=0.5; h=applyCols(grid,CARDS,ncol,f); } } // sparse pages (fewer cards than columns) narrow the grid and use their own best font; a page with unsplittable cards may need its own shrink
  requestAnimationFrame(positionCues);
}
function positionCues(){
  const m=document.getElementById('main'); const cl=document.getElementById('cueL'), cr=document.getElementById('cueR');
  if(!m||!cl||!cr)return;
  const r=m.getBoundingClientRect(); const max=m.scrollWidth-m.clientWidth; const over=max>6;
  [cl,cr].forEach(c=>{ c.style.top=r.top+'px'; c.style.height=r.height+'px'; });
  cr.classList.toggle('show', over && m.scrollLeft < max-4);
  cl.classList.toggle('show', over && m.scrollLeft > 4);
}
let _rt; function reflow(){clearTimeout(_rt);_rt=setTimeout(()=>{setHtop();fitCurrent();},120);}
window.addEventListener('resize',reflow);
window.addEventListener('orientationchange',()=>setTimeout(()=>{setHtop();fitCurrent();},350));
if(window.visualViewport)window.visualViewport.addEventListener('resize',reflow);

const NORMAL=PHASES.filter(p=>p.kind==='n'), ABN=PHASES.filter(p=>p.kind==='a');
// Checklist colours, identical to the Flows Trainer phase bar, keyed by the checklist each phase sits under.
const CL_COLORS={'Cockpit Prep':'#463C8F','Before Start':'#00568F','After Start':'#CE0C88','Taxi':'#2E90D0','Line-Up':'#E0A100','Climb':'#EAA52A','Cruise':'#D98A00','Descent':'#E2761A','Approach':'#D8650C','Landing':'#00805E','Go-Around':'#B85000','After Landing':'#2E9B7C','Parking':'#5CB89A'};
const PHASE_CL={'preflight':'Cockpit Prep','cockpit-prep':'Cockpit Prep','before-push':'Before Start','before-start':'Before Start','after-start':'After Start','taxi':'Taxi','before-takeoff':'Line-Up','after-takeoff':'Climb','cruise':'Cruise','descent':'Descent','approach':'Approach','landing':'Landing','go-around':'Go-Around','after-landing':'After Landing','parking':'Parking'};
function phaseColor(id){ const c=PHASE_CL[id]; return c ? CL_COLORS[c] : ''; }
function lighten(h,f){ f=f===undefined?0.45:f; const n=parseInt(h.slice(1),16); const r=n>>16, g=(n>>8)&255, b=n&255; const m=x=>Math.round(x+(255-x)*f).toString(16).padStart(2,'0'); return '#'+m(r)+m(g)+m(b); }
function pcStyle(pc){ return `--pc:${pc};--pcl:${lighten(pc)}`; }
(function(){
  let html='<span class="navlabel">NORMAL</span>';
  NORMAL.forEach(p=>{ const pc=phaseColor(p.id); html+=`<button data-p="${p.id}"${pc?` data-pc="1" style="${pcStyle(pc)}"`:``}>${p.label}</button>`; });
  html+='<div class="divider"></div><span class="navlabel">NON-NORMAL</span>';
  ABN.forEach(p=>{ const pc=phaseColor(p.id); html+=`<button class="ab" data-p="${p.id}"${pc?` data-pc="1" style="${pcStyle(pc)}"`:``}>${p.label}</button>`; });
  document.getElementById('nav').innerHTML=html;
  document.getElementById('rail').innerHTML=html;
  document.querySelectorAll('#nav button[data-p], #rail button[data-p]').forEach(b=>b.addEventListener('click',()=>{
    state.phase=b.dataset.p; render(); scrollActive(); }));
})();
const navEl=document.getElementById('nav');
navEl.insertAdjacentHTML('afterbegin','<button class="npag l gone" id="npl" aria-label="Scroll phases left">&#8249;</button>');
navEl.insertAdjacentHTML('beforeend','<button class="npag r" id="npr" aria-label="Scroll phases right">&#8250;</button>');
function navPage(dir){ navEl.scrollBy({left:dir*Math.max(170,navEl.clientWidth-120),behavior:'smooth'}); } // a full bar width less the pagers
navEl.addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ navEl.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false}); // Mac: vertical wheel or trackpad over the bar scrolls it sideways
document.getElementById('npl').addEventListener('click',()=>navPage(-1));
document.getElementById('npr').addEventListener('click',()=>navPage(1));
function updPagers(){ const max=navEl.scrollWidth-navEl.clientWidth;
  document.getElementById('npl').classList.toggle('gone',navEl.scrollLeft<=4);
  document.getElementById('npr').classList.toggle('gone',navEl.scrollLeft>=max-4); }
navEl.addEventListener('scroll',updPagers,{passive:true});
window.addEventListener('resize',updPagers);
function scrollActive(){
  const n=document.querySelector('#nav button.on'); if(n&&n.scrollIntoView)n.scrollIntoView({inline:"center",block:"nearest"});
  const r=document.querySelector('#rail button.on'); if(r&&r.scrollIntoView)r.scrollIntoView({block:"nearest"});
}
function step(dir){
  const i=PHASES.findIndex(p=>p.id===state.phase);
  const j=Math.min(PHASES.length-1,Math.max(0,i+dir));
  state.phase=PHASES[j].id; render(); scrollActive();
}
document.getElementById('prev').addEventListener('click',()=>step(-1));
document.getElementById('next').addEventListener('click',()=>step(1));
document.querySelectorAll('#seat button').forEach(b=>b.addEventListener('click',()=>{
  state.seat=b.dataset.s; document.querySelectorAll('#seat button').forEach(x=>x.classList.toggle('on',x===b)); GFONT=0; render();
}));
document.querySelectorAll('#duty button').forEach(b=>b.addEventListener('click',()=>{
  state.duty=b.dataset.d; document.querySelectorAll('#duty button').forEach(x=>x.classList.toggle('on',x===b)); GFONT=0; render();
}));
document.querySelectorAll('#appr button').forEach(b=>b.addEventListener('click',()=>{
  state.appr=b.dataset.a; document.querySelectorAll('#appr button').forEach(x=>x.classList.toggle('on',x===b)); GFONT=0; render();
}));
document.querySelectorAll('#cat button').forEach(b=>b.addEventListener('click',()=>{
  state.cat=+b.dataset.c; document.querySelectorAll('#cat button').forEach(x=>x.classList.toggle('on',x===b)); GFONT=0; render();
}));
const filtBtn=document.getElementById('filt');
function setFilt(){ filtBtn.textContent=state.hideOther?'MINE':'BOTH'; filtBtn.classList.toggle('on',state.hideOther);
  filtBtn.title=state.hideOther?'Showing only my steps - tap to show both crew members':'Showing both crew members - tap to show only my steps'; }
filtBtn.addEventListener('click',()=>{ state.hideOther=!state.hideOther; setFilt(); GFONT=0; render(); });
document.getElementById('notesBtn').addEventListener('click',()=>{ if(state.notesOpen)closeNotes(); else openNotes(); });
document.getElementById('main').addEventListener('click',e=>{
  if(window.getSelection().toString().length>0){ return; }
  if(state.notesOpen){ closeNotes(); return; }
  const q=e.target.closest('.it.has-q'); if(q){ q.classList.toggle('open'); return; }
  const sg=e.target.closest('.sub.has-sub'); if(sg){ sg.parentNode.classList.toggle('open'); return; }
  const c=e.target.closest('.cl.has-cl'); if(c){ c.parentNode.classList.toggle('open'); }
});
const themeBtn=document.getElementById('theme');
function setTheme(dark){ document.body.classList.toggle('dark',dark); themeBtn.innerHTML=dark?'&#9790;':'&#9728;'; // moon while dark, sun while light (Ryan, 2026-09-22)
  try{localStorage.setItem('a330dark',dark?'1':'0');}catch(e){} }
themeBtn.addEventListener('click',()=>setTheme(!document.body.classList.contains('dark')));
const qref=document.getElementById('qref'), qrefTheme=document.getElementById('qrefTheme');
function setQrefTheme(dark){ qref.classList.toggle('dark',dark); qrefTheme.innerHTML=dark?'&#9790;':'&#9728;'; try{localStorage.setItem('a330qrefdark',dark?'1':'0');}catch(e){} }
function openQref(){ let d=document.body.classList.contains('dark'); try{const v=localStorage.getItem('a330qrefdark'); if(v!==null) d=(v==='1');}catch(e){} setQrefTheme(d); qref.hidden=false; document.getElementById('qrefBtn').classList.add('on'); try{history.pushState({qref:1},'');}catch(e){} }
function closeQref(fromPop){ if(qref.hidden) return; qref.hidden=true; document.getElementById('qrefBtn').classList.remove('on'); if(!fromPop && history.state && history.state.qref){ try{history.back();}catch(e){} } }
document.getElementById('qrefBtn').addEventListener('click',()=>{ if(qref.hidden) openQref(); else closeQref(); });
document.getElementById('qrefBack').addEventListener('click',()=>closeQref());
qrefTheme.addEventListener('click',()=>setQrefTheme(!qref.classList.contains('dark')));
window.addEventListener('popstate',()=>closeQref(true));
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !qref.hidden) closeQref(); });
const fitBtn=document.getElementById('fit');
function setFit(on){ state.fit=on; fitBtn.classList.toggle('on',on); fitBtn.title=on?'Fit to screen is on. Tap to scroll at reading size':'Reading size. Tap to fit the page to the screen'; try{localStorage.setItem('a330fit',on?'1':'0');}catch(e){} }
fitBtn.addEventListener('click',()=>{ setFit(!state.fit); GFONT=0; fitCurrent(); });
{ let f=true; try{f=localStorage.getItem('a330fit')!=='0';}catch(e){} setFit(f); }
let dk=false; try{dk=localStorage.getItem('a330dark')==='1';}catch(e){}
setTheme(dk);
// restore persisted phase + toggles
try{const s=JSON.parse(localStorage.getItem('a330state')||'{}');
  if(s.phase&&PHASES.find(p=>p.id===s.phase))state.phase=s.phase;
  if(s.seat)state.seat=s.seat; if(s.duty)state.duty=s.duty; if(s.appr)state.appr=s.appr; if(s.cat)state.cat=+s.cat;
  if(typeof s.hideOther==='boolean')state.hideOther=s.hideOther;
}catch(e){}
function syncToggles(){
  document.querySelectorAll('#seat button').forEach(x=>x.classList.toggle('on',x.dataset.s===state.seat));
  document.querySelectorAll('#duty button').forEach(x=>x.classList.toggle('on',x.dataset.d===state.duty));
  document.querySelectorAll('#appr button').forEach(x=>x.classList.toggle('on',x.dataset.a===state.appr));
  document.querySelectorAll('#cat button').forEach(x=>x.classList.toggle('on',+x.dataset.c===state.cat));
  setFilt();
}
syncToggles();
function setHtop(){ const h=document.querySelector('header'); if(h)document.documentElement.style.setProperty('--htop',h.offsetHeight+'px'); }
setHtop(); window.addEventListener('resize',setHtop);
document.getElementById('main').addEventListener('scroll',positionCues,{passive:true});
window.addEventListener('resize',positionCues);
window.addEventListener('orientationchange',()=>setTimeout(positionCues,380));
render(); scrollActive();
window.addEventListener('load',()=>{setHtop();fitCurrent();scrollActive();setTimeout(()=>{setHtop();fitCurrent();positionCues();},300);});
Object.assign(window,{applyCols, apprVisible, bestFontFor, boldCO, boldST, bullets, cardsFor, closeNotes, colsForWidth, computeGFont, deco, fitCurrent, fitNotesToScreen, fitToScreen, gateFor, hl, navPage, notesCards, openNotes, positionCues, render, renderItem, renderNotes, roleMatch, rtagHtml, saveState, scrollActive, sectionInner, setFilt, setHtop, setTheme, step, syncToggles, updPagers});
}).catch(function(e){(document.getElementById('main')||document.body).innerHTML='<div class="empty">Phase data failed to load: '+e.message+'</div>';});
</script>
